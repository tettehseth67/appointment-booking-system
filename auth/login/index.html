<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | ConsultPro</title>
    <link rel="stylesheet" href="../../style.css">
</head>

<body>

    <section class="auth-section">

        <div class="auth-card">

            <div class="auth-logo">
                <h1>ConsultPro</h1>
                <p>Appointment Booking System</p>
            </div>

            <form class="auth-form">

                <h2>Welcome Back</h2>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" name="email" id="email" placeholder="Enter your email">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" name="password" id="password" placeholder="Enter password" required autocomplete="current-password">
                </div>

                <button type="submit" class="auth-button">
                    Sign In
                </button>

                <div class="auth-links">

                    <a href="../forgot-password/index.html">
                        Forgot Password?
                    </a>

                    <a href="../register/index.html">
                        Create Account
                    </a>

                </div>

            </form>

        </div>
    </section>

</body>

</html>
